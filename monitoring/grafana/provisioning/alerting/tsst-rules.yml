# Reglas de alerta TSST (generado; formato JSON, que también es YAML válido)
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "tsst",
      "folder": "TSST",
      "interval": "20s",
      "rules": [
        {
          "uid": "tsst-senal-perdida",
          "title": "Señal perdida",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "tsst_input_up * on(channel) group_left() (1 - tsst_input_signal)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "30s",
          "annotations": {
            "summary": "Sin señal: {{ $labels.name }} (canal {{ $labels.channel }})",
            "description": "No llegan datos desde hace más de 30 s. Revisa la cámara, el emisor o la red.",
            "resolved": "Señal recuperada: {{ $labels.name }} (canal {{ $labels.channel }})"
          },
          "labels": {
            "severity": "critical",
            "app": "tsst"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-salida-caida",
          "title": "Salida sin emitir",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "(tsst_output_bitrate_bits_per_second == bool 0) * on(channel) group_left() max by (channel) (tsst_input_signal)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "1m",
          "annotations": {
            "summary": "La salida {{ $labels.location }} no emite",
            "description": "La entrada tiene señal pero esta salida lleva más de 1 min sin enviar datos. Revisa el destino.",
            "resolved": "La salida {{ $labels.location }} vuelve a emitir"
          },
          "labels": {
            "severity": "critical",
            "app": "tsst"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-srt-drops",
          "title": "Cortes SRT (drops)",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "increase(tsst_srt_packets_dropped_total[2m])",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "annotations": {
            "summary": "Cortes SRT en {{ $labels.name }}{{ $labels.location }}",
            "description": "Llegan paquetes tarde y se ven cortes en la imagen. Sube la latencia SRT (3-4 × RTT).",
            "resolved": "Sin cortes SRT en {{ $labels.name }}{{ $labels.location }}"
          },
          "labels": {
            "severity": "warning",
            "app": "tsst"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-srt-latencia",
          "title": "Latencia SRT corta para la red",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "tsst_srt_latency_seconds < bool (3 * tsst_srt_rtt_seconds)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "Latencia SRT corta en {{ $labels.name }}{{ $labels.location }}",
            "description": "La latencia es menor que 3 × RTT: hay riesgo de cortes. Recomendado: 4 × RTT.",
            "resolved": "Latencia SRT correcta en {{ $labels.name }}{{ $labels.location }}"
          },
          "labels": {
            "severity": "warning",
            "app": "tsst"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-cpu",
          "title": "CPU alta",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "tsst_host_cpu_load_ratio > bool 0.9",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "CPU del servidor por encima del 90 %",
            "description": "Usa Quick Sync en lugar de la conversión por CPU (libx264/libx265).",
            "resolved": "CPU del servidor de nuevo normal"
          },
          "labels": {
            "severity": "warning",
            "app": "tsst"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-servidor-caido",
          "title": "Servidor TSST caído",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "1 - up{job=\"tsst\"}",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "30s",
          "annotations": {
            "summary": "El servidor TSST no responde",
            "description": "Prometheus no puede leerlo. Comprueba: systemctl status tsst-srt",
            "resolved": "El servidor TSST vuelve a responder"
          },
          "labels": {
            "severity": "critical",
            "app": "tsst"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-input-apagado",
          "title": "Stream apagado desde el panel",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "1 - tsst_input_enabled",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "annotations": {
            "summary": "Entrada apagada desde el panel: {{ $labels.name }} (canal {{ $labels.channel }})",
            "description": "Se ha desactivado a mano en el panel; sus salidas también se paran.",
            "resolved": "Entrada encendida de nuevo desde el panel: {{ $labels.name }} (canal {{ $labels.channel }})"
          },
          "labels": {
            "severity": "info",
            "app": "tsst",
            "kind": "manual"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-output-apagado",
          "title": "Salida apagada desde el panel",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "1 - tsst_output_enabled",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "annotations": {
            "summary": "Salida apagada desde el panel: {{ $labels.location }} ({{ $labels.name }})",
            "description": "Se ha desactivado a mano en el panel.",
            "resolved": "Salida encendida de nuevo desde el panel: {{ $labels.location }} ({{ $labels.name }})"
          },
          "labels": {
            "severity": "info",
            "app": "tsst",
            "kind": "manual"
          },
          "isPaused": false
        },
        {
          "uid": "tsst-encoder-caido",
          "title": "Encoder sin conexión",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "1 - tsst_encoder_up",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "1m",
          "annotations": {
            "summary": "Encoder sin conexión: {{ $labels.name }}",
            "description": "Su web no responde desde hace más de 1 minuto. Si tiene túnel WireGuard, revisa el router del sitio (cobertura, alimentación) y el encoder.",
            "resolved": "Encoder de nuevo en línea: {{ $labels.name }}"
          },
          "labels": {
            "severity": "warning",
            "app": "tsst"
          },
          "isPaused": false
        }
      ]
    }
  ]
}
