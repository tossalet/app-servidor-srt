# Reglas de alerta TSST (formato JSON, que también es YAML válido).
# El resto de avisos (señal, salidas, cortes SRT, CPU, panel) los manda el propio servidor por Telegram
# en segundos (telegram.js). Aquí sólo queda lo que la app no puede decir de sí misma: que se ha caído.
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "tsst",
      "folder": "TSST",
      "interval": "10s",
      "rules": [
        {
          "uid": "tsst-servidor-caido",
          "title": "Servidor TSST caído",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "tsst-prom",
              "model": {
                "refId": "A",
                "expr": "1 - up{job=\"tsst\"}",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "30s",
          "annotations": {
            "summary": "El servidor TSST no responde",
            "description": "Prometheus no puede leerlo. Comprueba: systemctl status tsst-srt",
            "resolved": "El servidor TSST vuelve a responder"
          },
          "labels": {
            "severity": "critical",
            "app": "tsst"
          },
          "isPaused": false
        }
      ]
    }
  ],
  "deleteRules": [
    {
      "orgId": 1,
      "uid": "tsst-senal-perdida"
    },
    {
      "orgId": 1,
      "uid": "tsst-salida-caida"
    },
    {
      "orgId": 1,
      "uid": "tsst-srt-drops"
    },
    {
      "orgId": 1,
      "uid": "tsst-srt-latencia"
    },
    {
      "orgId": 1,
      "uid": "tsst-cpu"
    },
    {
      "orgId": 1,
      "uid": "tsst-input-apagado"
    },
    {
      "orgId": 1,
      "uid": "tsst-output-apagado"
    },
    {
      "orgId": 1,
      "uid": "tsst-encoder-caido"
    }
  ]
}
