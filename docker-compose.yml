version: '3.8'

# Los buffers UDP (sysctl net.core.rmem_max/wmem_max) se configuran en el HOST:
# con network_mode host el contenedor usa los del sistema. Ver instalar_servidor.sh.
#
# Sólo el servidor:             docker compose up -d
# Con Prometheus + Grafana:     GRAFANA_ADMIN_PASSWORD=xxxxxxxx docker compose --profile monitoring up -d

services:
  tsst-server:
    # Imagen que publica GitHub Actions en cada push a main (la usa instalar_dockers.sh con "pull").
    # Con "docker compose up -d --build" se construye en local desde este Dockerfile.
    image: ghcr.io/tossalet/app-servidor-srt:main
    build: .
    container_name: tsst_server
    restart: always
    network_mode: "host" # Crucial for SRT/UDP port allocations without heavy iptables
    stop_grace_period: 10s # Tiempo para cerrar grabaciones limpias
    devices:
      - /dev/dri:/dev/dri # GPU Intel Quick Sync para transcodificar por hardware
    shm_size: "64m" # Miniaturas en /dev/shm
    volumes:
      - tsst_data:/usr/src/app/data
      # rslave: los USB que se conectan DESPUÉS de arrancar el contenedor también se ven dentro
      - /media:/media:rslave
    environment:
      - NODE_ENV=production
      - GRAFANA_PORT=${GRAFANA_PORT:-} # Ponlo a 3001 si usas el perfil monitoring: aparece "Gráficas" en el panel

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tsst_prometheus
    profiles: ["monitoring"]
    restart: always
    network_mode: "host"
    cpu_shares: 256 # Menos prioridad que el vídeo
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro # Apunta a localhost:4000 (puerto del panel en Docker)
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: tsst_grafana
    profiles: ["monitoring"]
    restart: always
    network_mode: "host"
    cpu_shares: 256
    environment:
      - GF_SERVER_HTTP_PORT=3001
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin} # Si no la defines, Grafana pide cambiarla al entrar
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/tsst/tsst.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Alertas por Telegram: copia monitoring/grafana/telegram.yml.template a esta carpeta como tsst-telegram.yml y rellénalo
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards/tsst:ro

volumes:
  tsst_data:
  prometheus_data:
  grafana_data:
